name: Bootstrap hieroglyphic keyboard from audited aaa source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'sydgouda2022/hieroglyphic-keyboard'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - name: Import isolated source, canonical release and provenance
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/sydgouda2022/aaa.git /tmp/aaa-original
          mkdir -p src tests sources tools release docs
          cp /tmp/aaa-original/shared-language/src/*.py src/
          cp /tmp/aaa-original/shared-language/src/*.mjs src/
          cp /tmp/aaa-original/shared-language/tests/* tests/
          cp /tmp/aaa-original/shared-language/sources/* sources/
          cp /tmp/aaa-original/mdwnfr/web/keyboard_catalog.js src/
          cp /tmp/aaa-original/renpet/tools/build_keyboard_signs.py tools/
          cp /tmp/aaa-original/renpet/tools/keyboard-signs-source.json tools/
          cp /tmp/aaa-original/mdwnfr/web/lexicon/{lexicon.json,manifest.json,coverage.json} release/
          cp /tmp/aaa-original/mdwnfr/data/lexicon.sqlite3 release/
          cp -a /tmp/aaa-original/shared-language/releases ./releases
          cp /tmp/aaa-original/shared-language/README.md docs/UPSTREAM_SOURCE.md
          rm -f src/coptic_install.mjs src/publish_compiled_coptic.py src/publish_coptic_release.py
          rm -f tests/coptic_install.test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/build_keyboard_signs.py')
          s=p.read_text().replace("ROOT / 'web/assets/dictionaries/signs.json'", "ROOT / 'release/signs.json'")
          p.write_text(s)
          PY
          python tools/build_keyboard_signs.py
          python - <<'PY'
          import hashlib,json,sqlite3,subprocess
          from pathlib import Path
          d=Path('release')
          m=json.loads((d/'manifest.json').read_text())
          blob=(d/'lexicon.json').read_bytes()
          assert hashlib.sha256(blob).hexdigest()==m['sha256']
          assert len(blob)==m['bytes'] and m['spelling_records']==41330
          assert json.loads(blob)['metadata']['spelling_records']==41330
          with sqlite3.connect(d/'lexicon.sqlite3') as c:
              assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          p={'origin':'sydgouda2022/aaa','commit':subprocess.check_output(['git','-C','/tmp/aaa-original','rev-parse','HEAD'],text=True).strip(),
             'release_sha256':m['sha256'],'records':m['spelling_records']}
          Path('SOURCE_PROVENANCE.json').write_text(json.dumps(p,indent=2)+'\n')
          PY
          cat > README.md <<'EOF'
          # Hieroglyphic Keyboard + Lexicon

          Owns the Late Egyptian source-pinned, native Unicode prediction engine,
          hieroglyphic sign catalog, and canonical SQLite/JSON spelling database.
          Renpet and MdwNfr consume versioned copies of these assets, never
          write to the source lexicon. Input remains separate from application
          text-composition and page-layout systems.

          The initial migrated release is verified against the original
          `aaa` source and its SHA-256 manifest. See SOURCE_PROVENANCE.json.
          EOF
      - name: Test independently before publishing
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/keyboard_search.test.mjs tests/predict.test.mjs tests/lexicon_install.test.mjs
          python -m compileall -q src
      - name: Publish verified import into this GitHub repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > .gitignore <<'EOF'
          __pycache__/
          *.pyc
          EOF
          git rm -r --cached --ignore-unmatch src/__pycache__ tests/__pycache__
          git add README.md src tests sources tools release releases docs SOURCE_PROVENANCE.json .gitignore
          git diff --cached --quiet && exit 0
          git commit -m 'Import and verify independent hieroglyphic keyboard and lexicon'
          git push origin HEAD:main
