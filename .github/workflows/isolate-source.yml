name: Isolate egy keyboard publisher code
on:
  push:
    branches: [main]
    paths: ['tools/isolate_keyboard.py', '.github/workflows/isolate-source.yml']
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - name: Split original bilingual compiler and enforce isolated API
        run: python tools/isolate_keyboard.py egy
      - name: Validate standalone source and untouched lexical release
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.mjs
          python - <<'PY'
          import json,hashlib,sqlite3
          from pathlib import Path
          p=Path('release');m=json.loads((p/'manifest.json').read_text())
          blob=(p/'lexicon.json').read_bytes()
          assert hashlib.sha256(blob).hexdigest()==m['sha256']
          assert m['language']=='egy'
          with sqlite3.connect(p/'lexicon.sqlite3') as db:
              assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
          print('Independent publisher and source checksum verified.')
          PY
      - name: Publish only passing language-specific source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src tests
          git diff --cached --quiet && exit 0
          git commit -m 'Isolate language-specific compiler and public keyboard API'
          git push origin HEAD:main
