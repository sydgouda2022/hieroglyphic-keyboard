name: Verify headless Egyptian keyboard API
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify canonical native lexicon, source registry and SQLite parity
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          from source_registry import read_registry
          registry=read_registry()
          assert registry['policy']['complete'] is False
          p=Path('release')
          manifest=json.loads((p/'manifest.json').read_text())
          payload_bytes=(p/'lexicon.json').read_bytes()
          assert hashlib.sha256(payload_bytes).hexdigest()==manifest['sha256']
          assert len(payload_bytes)==manifest['bytes']
          payload=json.loads(payload_bytes)
          assert payload['metadata']['complete'] is False
          assert manifest['complete'] is False
          assert len(payload['entries'])==manifest['spelling_records']
          assert payload['metadata']['spelling_records']==len(payload['entries'])
          seen=set()
          for row in payload['entries']:
              assert row['ref'] not in seen
              seen.add(row['ref'])
          with sqlite3.connect(p/'lexicon.sqlite3') as db:
              assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
              dbrows={r[0]:(r[1],r[2]) for r in db.execute('select id,native_form,frequency from spelling')}
              assert len(dbrows)==len(payload['entries'])
              assert all(dbrows[e['ref']]==(e['signs'],e['attestations']) for e in payload['entries'])
          provenance=json.loads(Path('SOURCE_PROVENANCE.json').read_text())
          assert provenance['release_sha256']==manifest['sha256']
          PY
      - name: Test public headless API and historical build tools
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q src tools
          npm pack --dry-run >/dev/null
      - name: Build the portable API-only artifact
        run: |
          set -euo pipefail
          python tools/export_api.py --out dist-api
          test -f dist-api/keyboard_api.mjs
          test -f dist-api/keyboard_search.mjs
          test -f dist-api/lexicon/lexicon.json
          test -f dist-api/THIRD_PARTY_NOTICES.md
          test ! -f dist-api/index.html
          test ! -f dist-api/sw.js
          test ! -f dist-api/keyboard_ui.mjs
          test ! -f dist-api/font.ttf
          node --check dist-api/keyboard_api.mjs
          node --check dist-api/keyboard_search.mjs
          node --check dist-api/lexicon_install.mjs
          node --input-type=module -e "
          import {createKeyboardFromData,API_VERSION} from './dist-api/keyboard_api.mjs';
          const keyboard=createKeyboardFromData();
          if(API_VERSION!=='2.0.1')process.exit(1);
          if(keyboard.getSigns('uni').length!==27)process.exit(1);
          if(keyboard.searchSigns('M17A')[0].glyph!=='𓇌')process.exit(1);
          "
      - name: Upload API-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: hieroglyphic-keyboard-api-v2
          path: dist-api/
          if-no-files-found: error
